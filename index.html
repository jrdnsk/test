<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vier Gewinnt</title>
<style>
  * {
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #16213E;
    font-family: Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  body {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    -webkit-box-pack: center;
    justify-content: center;
    padding: 2vmin;
  }

  h1 {
    color: #F5F6FA;
    font-size: 5vmin;
    letter-spacing: 0.6vmin;
    text-transform: uppercase;
    margin: 0 0 1vmin 0;
    font-weight: 700;
  }
  h1 span {
    color: #F2C14E;
  }
  .subline {
    width: 9vmin;
    height: 0.5vmin;
    background: #E94560;
    margin-bottom: 2.5vmin;
  }

  #status {
    color: #E7ECF3;
    font-size: 2.8vmin;
    font-weight: bold;
    height: 4vmin;
    margin-bottom: 1.5vmin;
    letter-spacing: 0.2vmin;
  }
  #status .marker {
    display: inline-block;
    width: 2.4vmin;
    height: 2.4vmin;
    border-radius: 50%;
    margin-right: 1vmin;
    vertical-align: middle;
    position: relative;
    top: -0.1vmin;
  }

  #board {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: horizontal;
    -webkit-flex-direction: row;
    flex-direction: row;
    background: #0F3460;
    padding: 1.2vmin;
    border-radius: 1.8vmin;
  }

  .col {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-flex-direction: column;
    flex-direction: column;
  }

  .cell {
    width: 11vmin;
    height: 11vmin;
    margin: 0.8vmin;
    border-radius: 50%;
    background: #E7ECF3;
    position: relative;
  }

  .disc {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    -webkit-transform: scale(0);
    transform: scale(0);
    -webkit-transition: -webkit-transform 0.18s ease-out;
    transition: transform 0.18s ease-out;
  }
  .disc.placed {
    -webkit-transform: scale(1);
    transform: scale(1);
  }
  .disc.red { background: #E94560; }
  .disc.yellow { background: #F2C14E; }

  .cell.win .disc {
    box-shadow: 0 0 0 0.5vmin #F5F6FA inset;
  }

  #controls {
    margin-top: 3vmin;
  }

  #resetBtn {
    background: #E94560;
    color: #F5F6FA;
    border: none;
    padding: 1.8vmin 4vmin;
    font-size: 2.6vmin;
    font-weight: bold;
    letter-spacing: 0.2vmin;
    text-transform: uppercase;
    border-radius: 1vmin;
  }
  #resetBtn:active {
    background: #c8324a;
  }
</style>
</head>
<body>

  <h1>Vier <span>Gewinnt</span></h1>
  <div class="subline"></div>

  <div id="status"></div>

  <div id="board"></div>

  <div id="controls">
    <button id="resetBtn">Neues Spiel</button>
  </div>

<script>
(function () {
  'use strict';

  var ROWS = 6;
  var COLS = 7;
  var board = null;       // board[col][row], row 0 = oben
  var currentPlayer = 1;  // 1 = rot, 2 = gelb
  var gameOver = false;

  var boardEl = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var resetBtn = document.getElementById('resetBtn');

  var colEls = [];   // colEls[col] = column DOM element
  var cellEls = [];  // cellEls[col][row] = cell DOM element
  var discEls = [];  // discEls[col][row] = disc DOM element

  function createBoard() {
    boardEl.innerHTML = '';
    colEls = [];
    cellEls = [];
    discEls = [];
    board = [];

    var c, r;
    for (c = 0; c < COLS; c++) {
      board[c] = [];
      cellEls[c] = [];
      discEls[c] = [];

      var colEl = document.createElement('div');
      colEl.className = 'col';
      colEl.setAttribute('data-col', c);

      for (r = 0; r < ROWS; r++) {
        board[c][r] = 0;

        var cellEl = document.createElement('div');
        cellEl.className = 'cell';

        var discEl = document.createElement('div');
        discEl.className = 'disc';
        cellEl.appendChild(discEl);

        colEl.appendChild(cellEl);
        cellEls[c][r] = cellEl;
        discEls[c][r] = discEl;
      }

      colEl.addEventListener('click', makeColClickHandler(c), false);
      boardEl.appendChild(colEl);
      colEls[c] = colEl;
    }
  }

  function makeColClickHandler(c) {
    return function () {
      handleMove(c);
    };
  }

  function findFreeRow(c) {
    var r;
    for (r = ROWS - 1; r >= 0; r--) {
      if (board[c][r] === 0) {
        return r;
      }
    }
    return -1;
  }

  function handleMove(c) {
    if (gameOver) {
      return;
    }
    var r = findFreeRow(c);
    if (r === -1) {
      return;
    }

    board[c][r] = currentPlayer;

    var discEl = discEls[c][r];
    var colorClass = currentPlayer === 1 ? 'red' : 'yellow';
    discEl.className = 'disc ' + colorClass;

    // kurzer Timeout, damit die Transition zuverlaessig greift
    window.setTimeout(function () {
      discEl.className = 'disc ' + colorClass + ' placed';
    }, 10);

    var winLine = checkWin(c, r);
    if (winLine) {
      gameOver = true;
      highlightWin(winLine);
      setStatus(currentPlayer, true);
      return;
    }

    if (isBoardFull()) {
      gameOver = true;
      statusEl.innerHTML = 'Unentschieden!';
      return;
    }

    currentPlayer = currentPlayer === 1 ? 2 : 1;
    setStatus(currentPlayer, false);
  }

  function isBoardFull() {
    var c;
    for (c = 0; c < COLS; c++) {
      if (board[c][0] === 0) {
        return false;
      }
    }
    return true;
  }

  function checkWin(c, r) {
    var player = board[c][r];
    var directions = [
      [1, 0], [0, 1], [1, 1], [1, -1]
    ];
    var i;
    for (i = 0; i < directions.length; i++) {
      var dc = directions[i][0];
      var dr = directions[i][1];
      var line = [[c, r]];

      var step = 1;
      while (true) {
        var nc = c + dc * step;
        var nr = r + dr * step;
        if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS || board[nc][nr] !== player) {
          break;
        }
        line.push([nc, nr]);
        step++;
      }

      step = 1;
      while (true) {
        var pc = c - dc * step;
        var pr = r - dr * step;
        if (pc < 0 || pc >= COLS || pr < 0 || pr >= ROWS || board[pc][pr] !== player) {
          break;
        }
        line.push([pc, pr]);
        step++;
      }

      if (line.length >= 4) {
        return line;
      }
    }
    return null;
  }

  function highlightWin(line) {
    var i;
    for (i = 0; i < line.length; i++) {
      var c = line[i][0];
      var r = line[i][1];
      cellEls[c][r].className = 'cell win';
    }
  }

  function setStatus(player, won) {
    var colorClass = player === 1 ? 'red' : 'yellow';
    var name = player === 1 ? 'Rot' : 'Gelb';
    var text = won ? (name + ' gewinnt!') : (name + ' ist dran');
    statusEl.innerHTML = '<span class="marker disc ' + colorClass + ' placed"></span>' + text;
  }

  function resetGame() {
    currentPlayer = 1;
    gameOver = false;
    createBoard();
    setStatus(currentPlayer, false);
  }

  resetBtn.addEventListener('click', resetGame, false);

  resetGame();
})();
</script>

</body>
</html>
